<div class="min-h-screen bg-gray-100 p-8 flex flex-col items-center">
  <div class="bg-white shadow-xl rounded-lg p-6 w-full max-w-lg">
    <img src="/favicon.png" alt="" class="w-16 h-16 mx-auto mb-4"/>
    <h1 class="text-3xl font-extrabold text-gray-800 mb-4 text-center">
      {{ title()}}
    </h1>
    <p class="text-sm text-gray-500 mb-6 text-center">
      Tienes <span class="font-bold text-blue-600">{{ pendingTasks().length }}</span> tareas pendientes
    </p>

    <form (ngSubmit)="addTodo()" class="flex gap-2 mb-6">
      <input
        type="text"
        [(ngModel)]="newTask"
        name="newTask"
        placeholder="Escribe una nueva tarea..."
        class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150"
      />
      <button
        type="submit"
        [disabled]="!newTask.trim()"
        class="bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 disabled:bg-blue-300 transition duration-150"
      >
        Añadir
      </button>
    </form>
    
    <hr class="mb-6"/>

    @if(todos().length > 0){
      <ul 
        class="space-y-3 list"
        cdkDropList
        (cdkDropListDropped)="drop($event)"
      >
        @for (todo of todos(); track todo.id) {
          <li 
            class="flex items-center p-3 border border-gray-200 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition duration-150 hover:shadow-lg item"
            cdkDrag
          >
            <div class="mr-3 text-gray-400 cursor-grab" cdkDragHandle>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </div>
            
            <input
              type="checkbox"
              [checked]="todo.completed"
              (change)="toggle(todo.id)"
              class="form-checkbox h-5 w-5 text-blue-600 rounded mr-3 cursor-pointer"
            />
            
            <span 
              [class.line-through]="todo.completed"
              [class.text-gray-500]="todo.completed"
              [class.text-gray-800]="!todo.completed"
              class="flex-1 text-lg"
            >
              {{ todo.task }}
            </span>

            <button
              (click)="delete(todo.id)"
              class="text-red-500 hover:text-red-700 ml-3 p-1 rounded-full hover:bg-red-100 transition duration-150 cursor-pointer"
              aria-label="Eliminar tarea"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </li>
        }
        <div class="cdk-drag-placeholder bg-blue-100 border-2 border-blue-500 rounded-lg opacity-50 transition duration-150"></div>
      </ul>
    }@else{
      <div class="text-center p-6 bg-gray-200 border-l-4 border-[#FBBF24]-500 text-[#FBBF24]-700 rounded-md">
        <p class="font-medium">¡Todas las tareas completadas!</p>
        <p>Añade una nueva tarea arriba para empezar</p>
      </div>
    }
  </div>
</div>
